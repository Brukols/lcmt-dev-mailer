# Security checks (process in .claude/security.md):
# - Semgrep on our code (PHP, front-end sources, templates): new findings only on a pull request, every finding on
#   main and every Monday. lib/plugin-update-checker is a vendored third-party library and assets/dist is built output:
#   both are left out;
# - known vulnerabilities of the packages shipped in the built scripts (yarn "dependencies"), every Monday and on main.
#   esbuild only runs on the computer and in CI: Dependabot keeps it up to date.
# A failed job sends the usual GitHub e-mail; the findings are in the job log.
name: Security

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    semgrep:
        name: Semgrep
        runs-on: ubuntu-24.04
        container:
            # Official image (hub.docker.com/r/semgrep/semgrep), pinned by digest; update it like the other actions
            image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Scan
              env:
                  BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
              run: |
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  semgrep scan --metrics=off --error \
                    --config p/php --config p/javascript \
                    --config p/secrets --config p/security-audit --config p/xss \
                    ${BASELINE:+--baseline-commit "$BASELINE"} \
                    includes assets/src templates lcmt-dev-mailer.php uninstall.php

    dependencies:
        name: Dependencies
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Shipped packages (yarn)
              run: yarn audit --groups dependencies --level moderate
